spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: codesenseadmin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email
            redirect-uri: https://codesense-backend.azurewebsites.net/login/oauth2/code/github

server:
  forward-headers-strategy: native

storage:
  type: azure
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container: ${AZURE_STORAGE_CONTAINER:code-diffs}

logging:
  level:
    com.codesense: INFO
    org.springframework.security: WARN
