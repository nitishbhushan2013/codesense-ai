spring:
  application:
    name: codesense-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codesense_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: your-github-client-id
            client-secret: your-github-client-secret
            scope: user:email

server:
  port: 8080

app:
  jwt:
    secret: your-jwt-secret-key-change-this-in-production-minimum-32-chars
    expiration: 86400000

claude:
  api:
    key: your-claude-api-key
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514

logging:
  level:
    com.codesense: DEBUG
    org.springframework.security: DEBUG
