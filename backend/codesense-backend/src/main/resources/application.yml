spring:
  application:
    name: codesense-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codesense_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
    max-tokens: 4096
    retry-backoff-ms: 500

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_API_TOKEN:}

storage:
  type: local
  local:
    path: ./local-storage/code-diffs

logging:
  level:
    com.codesense: DEBUG
    org.springframework.security: DEBUG
